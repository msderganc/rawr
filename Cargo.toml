[package]
name = "rawr"
version = "0.1.0"
description = "Native Windows app for browsing, testing and extracting RAR archives, built on rars"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rars = { version = "=0.12.3", default-features = false, features = ["parallel", "encryption"] }
native-windows-gui = { version = "1.0.13", default-features = false, features = ["combobox", "embed-resource", "file-dialog", "high-dpi", "list-view", "notice", "progress-bar", "textbox"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
